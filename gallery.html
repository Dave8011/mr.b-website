<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Bhupesh Dave – Mr. B, India's Premier Mentalist</title>
    <meta name="description" content="Explore the gallery of Bhupesh Dave (Mr. B) — show videos, news coverage, event glimpses, and performance materials.">
    <link rel="canonical" href="https://bhupeshdave.com/gallery">
    <link rel="icon" href="/favicon.ico">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bhupeshdave.com/gallery">
    <meta property="og:title" content="Gallery | Bhupesh Dave – Mr. B">
    <meta property="og:description" content="Watch show videos, news cutouts, and event glimpses from India's premier mentalist Bhupesh Dave.">
    <meta property="og:image" content="https://bhupeshdave.com/images/hero.jpg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Global Styles -->
    <link rel="stylesheet" href="style-css/style.css">

    <!-- Gallery Page Styles -->
    <link rel="stylesheet" href="style-css/gallery.css">
</head>
<body>

    <!-- Background Ambient Glows -->
    <div class="bg-glow"></div>
    <div style="position:fixed;top:20%;right:10%;width:60vw;height:60vw;background:radial-gradient(circle,rgba(15,118,110,0.04) 0%,rgba(12,12,30,0) 60%);z-index:-2;pointer-events:none;"></div>

    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- ===================== HERO ===================== -->
    <section class="gallery-hero">
        <div class="container">
            <div class="gallery-hero-eyebrow">05 // GALLERY</div>
            <h1>Show <span class="gold-text">Highlights</span></h1>
            <p>Videos, news coverage, event glimpses &amp; stage materials — all in one place.</p>
        </div>
    </section>

    <!-- ===================== STICKY CONTROLS ===================== -->
    <div class="gallery-controls" id="gallery-controls">
        <div class="container">
            <div class="gallery-controls-inner">
                <!-- Search -->
                <div class="gallery-search-wrap">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input
                        type="search"
                        id="gallery-search-input"
                        class="gallery-search"
                        placeholder="Search videos, news, PDFs…"
                        autocomplete="off"
                        oninput="filterGallery()"
                    >
                </div>

                <!-- Filter Pills -->
                <div class="gallery-filters" id="gallery-filter-pills">
                    <button class="filter-pill active" data-filter="all" onclick="setFilter('all', this)">
                        <i class="fa-solid fa-border-all"></i> All
                    </button>
                    <button class="filter-pill" data-filter="video" onclick="setFilter('video', this)">
                        <i class="fa-solid fa-film"></i> Videos
                    </button>
                    <button class="filter-pill" data-filter="image" onclick="setFilter('image', this)">
                        <i class="fa-solid fa-image"></i> Images
                    </button>
                    <button class="filter-pill" data-filter="news" onclick="setFilter('news', this)">
                        <i class="fa-regular fa-newspaper"></i> News
                    </button>
                    <button class="filter-pill" data-filter="pdf" onclick="setFilter('pdf', this)">
                        <i class="fa-solid fa-file-pdf"></i> PDFs
                    </button>
                    <button class="filter-pill" data-filter="ppt" onclick="setFilter('ppt', this)">
                        <i class="fa-solid fa-file-powerpoint"></i> PPTs
                    </button>
                    <button class="filter-pill" data-filter="link" onclick="setFilter('link', this)">
                        <i class="fa-solid fa-link"></i> Links
                    </button>
                </div>

                <!-- Results count -->
                <span class="gallery-count" id="gallery-result-count"></span>
            </div>
        </div>
    </div>

    <!-- ===================== GALLERY GRID ===================== -->
    <section class="gallery-section">
        <div class="container">
            <div class="gallery-grid" id="gallery-grid">
                <!-- Cards injected by JS -->
            </div>
        </div>
    </section>

    <!-- ===================== VIDEO LIGHTBOX ===================== -->
    <div class="gallery-lightbox" id="video-lightbox" onclick="closeLightbox(event)">
        <div class="lightbox-inner">
            <button class="lightbox-close" onclick="closeLightbox(null, true)" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="lightbox-video-wrap" id="lightbox-video-wrap">
                <!-- iframe injected by JS -->
            </div>
            <div class="lightbox-title" id="lightbox-video-title"></div>
        </div>
    </div>

    <!-- ===================== IMAGE LIGHTBOX ===================== -->
    <div class="gallery-lightbox" id="image-lightbox" onclick="closeImageLightbox(event)">
        <div class="lightbox-inner" style="position:relative;">
            <button class="lightbox-close" onclick="closeImageLightbox(null, true)" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="lightbox-image-wrap" style="position:relative; display:flex; align-items:center; justify-content:center;">
                <!-- Prev Button -->
                <button id="lightbox-prev-btn" class="lightbox-nav-btn prev" onclick="event.stopPropagation(); prevGalleryImage()" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.65); border:1px solid rgba(255,255,255,0.25); color:#fff; width:44px; height:44px; border-radius:50%; cursor:pointer; display:none; align-items:center; justify-content:center; font-size:1.1rem; z-index:10; transition:all 0.2s;" onmouseover="this.style.background='var(--gold)'; this.style.color='#000';" onmouseout="this.style.background='rgba(0,0,0,0.65)'; this.style.color='#fff';">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <img id="lightbox-img" src="" alt="" style="max-width:100%; max-height:80vh; object-fit:contain; border-radius:8px;">
                <!-- Next Button -->
                <button id="lightbox-next-btn" class="lightbox-nav-btn next" onclick="event.stopPropagation(); nextGalleryImage()" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.65); border:1px solid rgba(255,255,255,0.25); color:#fff; width:44px; height:44px; border-radius:50%; cursor:pointer; display:none; align-items:center; justify-content:center; font-size:1.1rem; z-index:10; transition:all 0.2s;" onmouseover="this.style.background='var(--gold)'; this.style.color='#000';" onmouseout="this.style.background='rgba(0,0,0,0.65)'; this.style.color='#fff';">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem 0.5rem 0;">
                <div class="lightbox-title" id="lightbox-img-title" style="margin:0;"></div>
                <div id="lightbox-counter" style="color:var(--gold); font-size:0.85rem; font-weight:700; display:none; background:rgba(201,160,42,0.12); border:1px solid rgba(201,160,42,0.3); padding:3px 10px; border-radius:12px;"></div>
            </div>
        </div>
    </div>

    <!-- ===================== PDF MODAL ===================== -->
    <div class="pdf-modal" id="pdf-modal">
        <div class="pdf-modal-header">
            <div class="pdf-modal-title">
                <i class="fa-solid fa-file-pdf"></i>
                <span id="pdf-modal-title-text">Document</span>
            </div>
            <div class="pdf-modal-actions">
                <a id="pdf-download-btn" href="#" download class="pdf-btn pdf-btn-download">
                    <i class="fa-solid fa-download"></i> Download
                </a>
                <button class="pdf-btn pdf-btn-close" onclick="closePdfModal()">
                    <i class="fa-solid fa-xmark"></i> Close
                </button>
            </div>
        </div>
        <div class="pdf-modal-body">
            <iframe id="pdf-iframe" src="" title="PDF Viewer"></iframe>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="components.js" defer></script>

    <script>
    // =========================================================
    //  Gallery Page — Logic
    // =========================================================

    let allItems = [];
    let currentFilter = 'all';

    // Normalize item types so varying names/plurals map consistently to active tabs
    function normalizeType(type) {
        if (!type) return 'image';
        const t = String(type).toLowerCase().trim();
        if (t === 'video' || t === 'videos' || t === 'yt' || t === 'youtube') return 'video';
        if (t === 'image' || t === 'images' || t === 'img' || t === 'photo' || t === 'photos') return 'image';
        if (t === 'news' || t === 'article' || t === 'press') return 'news';
        if (t === 'pdf' || t === 'pdfs' || t === 'doc' || t === 'document') return 'pdf';
        if (t === 'ppt' || t === 'pptx' || t === 'presentation') return 'ppt';
        if (t === 'link' || t === 'links' || t === 'url') return 'link';
        return t;
    }

    // Extract YouTube video ID from various URL formats (watch, embed, short, share)
    function getYouTubeId(url) {
        if (!url) return null;
        try {
            const match = url.match(/(?:embed\/|v=|vi\/|youtu\.be\/|\/v\/|\/e\/|watch\?v=|shorts\/)([a-zA-Z0-9_-]{11})/);
            if (match && match[1]) return match[1];
        } catch (e) {}
        return null;
    }

    // Derive YouTube thumbnail from URL
    function getYouTubeThumbnail(url) {
        const id = getYouTubeId(url);
        return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : null;
    }

    // Check if URL points directly to a video file
    function isDirectVideo(url) {
        if (!url) return false;
        return /\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(url);
    }

    // Format date nicely
    function formatDate(dateStr) {
        if (!dateStr) return '';
        try {
            return new Date(dateStr).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        } catch (e) { return dateStr; }
    }

    // Build a single card HTML
    function buildCard(item) {
        const dateStr = formatDate(item.date);
        const normType = normalizeType(item.type);

        if (normType === 'video') {
            const thumb = item.thumbnail || getYouTubeThumbnail(item.url) || '';
            const safeTitle = (item.title || 'Show Video').replace(/'/g, "\\'").replace(/"/g, '&quot;');
            return `
            <div class="gallery-card" data-type="video" data-title="${(item.title||'').toLowerCase()}" data-desc="${(item.description||'').toLowerCase()}"
                 onclick="openVideo('${encodeURIComponent(item.url || '')}', '${safeTitle}')">
                <div class="gallery-card-thumb">
                    <span class="card-type-badge badge-video"><i class="fa-solid fa-film"></i> Video</span>
                    ${thumb ? `<img src="${thumb}" alt="${safeTitle}" loading="lazy" onerror="this.style.display='none'">` : '<div style="width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-film" style="font-size:3rem;color:rgba(255,255,255,0.2);"></i></div>'}
                    <div class="play-overlay">
                        <div class="play-btn-circle"><i class="fa-solid fa-play"></i></div>
                    </div>
                </div>
                <div class="gallery-card-body">
                    <div class="gallery-card-title">${item.title || 'Show Video'}</div>
                    ${item.description ? `<div class="gallery-card-desc">${item.description}</div>` : ''}
                    <div class="gallery-card-footer">
                        <span class="gallery-card-date">${dateStr}</span>
                        <span class="gallery-card-action"><i class="fa-solid fa-play"></i> Watch</span>
                    </div>
                </div>
            </div>`;
        }

        if (normType === 'news' || normType === 'image') {
            const isNews = normType === 'news';
            const hasMultiple = Array.isArray(item.images) && item.images.length > 1;
            const imgSrc = (hasMultiple ? item.images[0] : item.url) || item.url || '';
            const iconClass = isNews ? 'fa-regular fa-newspaper' : 'fa-solid fa-image';
            const label = isNews ? 'News' : 'Image';
            const badgeStyle = isNews ? '' : 'style="background: rgba(167, 139, 250, 0.15); color: #a78bfa; border: 1px solid rgba(167, 139, 250, 0.3);"';
            const badgeClass = isNews ? 'badge-news' : '';
            const safeTitle = (item.title || label).replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const imagesJson = hasMultiple ? encodeURIComponent(JSON.stringify(item.images)) : '';

            const clickHandler = hasMultiple
                ? `openImageGallery(JSON.parse(decodeURIComponent('${imagesJson}')), '${safeTitle}')`
                : `openImage('${imgSrc}', '${safeTitle}')`;

            const groupBadge = hasMultiple
                ? `<span style="position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,0.75); color:var(--gold); border:1px solid rgba(201,160,42,0.4); font-size:0.75rem; font-weight:700; padding:3px 8px; border-radius:6px; backdrop-filter:blur(6px); z-index:2;"><i class="fa-solid fa-layer-group" style="margin-right:4px;"></i>${item.images.length} ${isNews ? 'Cutouts' : 'Photos'}</span>`
                : '';

            return `
            <div class="gallery-card" data-type="${normType}" data-title="${(item.title||'').toLowerCase()}" data-desc="${(item.description||'').toLowerCase()}"
                 onclick="${clickHandler}">
                <div class="gallery-card-thumb" style="position:relative;">
                    <span class="card-type-badge ${badgeClass}" ${badgeStyle}><i class="${iconClass}"></i> ${label}</span>
                    ${groupBadge}
                    ${imgSrc ? `<img src="${imgSrc}" alt="${safeTitle}" loading="lazy">` : `<div style="width:100%;height:100%;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;"><i class="${iconClass}" style="font-size:3rem;color:rgba(255,255,255,0.2);"></i></div>`}
                </div>
                <div class="gallery-card-body">
                    <div class="gallery-card-title">${item.title || label}</div>
                    ${item.description ? `<div class="gallery-card-desc">${item.description}</div>` : ''}
                    <div class="gallery-card-footer">
                        <span class="gallery-card-date">${dateStr}</span>
                        <span class="gallery-card-action"><i class="fa-solid ${hasMultiple ? 'fa-layer-group' : 'fa-expand'}"></i> ${hasMultiple ? 'View Set' : 'View'}</span>
                    </div>
                </div>
            </div>`;
        }

        if (normType === 'pdf' || normType === 'ppt') {
            const safeTitle = (item.title || 'Document').replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const isPpt = normType === 'ppt';
            const icon = isPpt ? 'fa-file-powerpoint' : 'fa-file-pdf';
            const label = isPpt ? 'PPT Document' : 'PDF Document';
            const color = isPpt ? '#f97316' : '#ef4444';
            return `
            <div class="gallery-card" data-type="${normType}" data-title="${(item.title||'').toLowerCase()}" data-desc="${(item.description||'').toLowerCase()}"
                 onclick="openPdf('${encodeURIComponent(item.url || '')}', '${safeTitle}', ${isPpt})">
                <div class="gallery-card-thumb pdf-thumb" style="background: rgba(${isPpt?'249,115,22':'239,68,68'},0.05); border-bottom:1px solid rgba(255,255,255,0.05);">
                    <span class="card-type-badge badge-pdf" style="background: ${color};"><i class="fa-solid ${icon}"></i> ${normType.toUpperCase()}</span>
                    <i class="fa-solid ${icon} pdf-icon-big" style="color: ${color};"></i>
                    <span class="pdf-ext-badge" style="color: ${color};">${label}</span>
                </div>
                <div class="gallery-card-body">
                    <div class="gallery-card-title">${item.title || 'Document'}</div>
                    ${item.description ? `<div class="gallery-card-desc">${item.description}</div>` : ''}
                    <div class="gallery-card-footer">
                        <span class="gallery-card-date">${dateStr}</span>
                        <span class="gallery-card-action"><i class="fa-solid fa-book-open"></i> Open</span>
                    </div>
                </div>
            </div>`;
        }

        if (normType === 'link') {
            const thumb = item.thumbnail || '';
            const safeTitle = (item.title || 'Link').replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const safeUrl = item.url || '#';
            return `
            <div class="gallery-card" data-type="link" data-title="${(item.title||'').toLowerCase()}" data-desc="${(item.description||'').toLowerCase()}"
                 onclick="window.open('${safeUrl}', '_blank', 'noopener,noreferrer')">
                <div class="gallery-card-thumb">
                    <span class="card-type-badge" style="background:rgba(59,130,246,0.18); color:#60a5fa; border:1px solid rgba(59,130,246,0.3);"><i class="fa-solid fa-link"></i> Link</span>
                    ${thumb ? `<img src="${thumb}" alt="${safeTitle}" loading="lazy">` : `<div style="width:100%;height:100%;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-link" style="font-size:3rem;color:rgba(255,255,255,0.2);"></i></div>`}
                </div>
                <div class="gallery-card-body">
                    <div class="gallery-card-title">${item.title || 'External Resource'}</div>
                    ${item.description ? `<div class="gallery-card-desc">${item.description}</div>` : ''}
                    <div class="gallery-card-footer">
                        <span class="gallery-card-date">${dateStr}</span>
                        <span class="gallery-card-action"><i class="fa-solid fa-arrow-up-right-from-square"></i> Visit</span>
                    </div>
                </div>
            </div>`;
        }

        return '';
    }

    function renderGallery(items) {
        const grid = document.getElementById('gallery-grid');
        const countEl = document.getElementById('gallery-result-count');

        const visible = items.filter(i => !i.hidden);

        if (!visible.length) {
            grid.innerHTML = `
                <div class="gallery-empty">
                    <i class="fa-solid fa-photo-film"></i>
                    <h3>Nothing found</h3>
                    <p>Try a different search term or filter.</p>
                </div>`;
            countEl.textContent = '0 items';
            return;
        }

        countEl.textContent = `${visible.length} item${visible.length !== 1 ? 's' : ''}`;
        grid.innerHTML = visible.map(buildCard).join('');
    }

    function filterGallery() {
        const query = (document.getElementById('gallery-search-input')?.value || '').toLowerCase().trim();

        let filtered = allItems.filter(item => !item.hidden);

        if (currentFilter !== 'all') {
            filtered = filtered.filter(i => normalizeType(i.type) === currentFilter);
        }

        if (query) {
            filtered = filtered.filter(i =>
                (i.title || '').toLowerCase().includes(query) ||
                (i.description || '').toLowerCase().includes(query)
            );
        }

        const grid = document.getElementById('gallery-grid');
        const countEl = document.getElementById('gallery-result-count');

        if (!filtered.length) {
            grid.innerHTML = `
                <div class="gallery-empty">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <h3>No results found</h3>
                    <p>Try searching with a different keyword or category.</p>
                </div>`;
            countEl.textContent = '0 items';
            return;
        }

        countEl.textContent = `${filtered.length} item${filtered.length !== 1 ? 's' : ''}`;
        grid.innerHTML = filtered.map(buildCard).join('');
    }

    function setFilter(type, btn) {
        currentFilter = normalizeType(type);
        document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
        if (btn) {
            btn.classList.add('active');
        } else {
            const matching = document.querySelector(`.filter-pill[data-filter="${type}"]`);
            if (matching) matching.classList.add('active');
        }
        filterGallery();
    }

    function setupFilterListeners() {
        document.querySelectorAll('.filter-pill').forEach(btn => {
            btn.onclick = function(e) {
                e.preventDefault();
                const filter = this.getAttribute('data-filter');
                setFilter(filter, this);
            };
        });
    }

    // ---- Video Lightbox ----
    function openVideo(encodedUrl, title) {
        const url = decodeURIComponent(encodedUrl);
        const wrap = document.getElementById('lightbox-video-wrap');
        document.getElementById('lightbox-video-title').textContent = title;

        if (isDirectVideo(url)) {
            wrap.innerHTML = `<video src="${url}" controls autoplay style="width:100%; height:100%; max-height:80vh; border-radius:10px;"></video>`;
        } else {
            const ytid = getYouTubeId(url);
            let embedUrl = url;
            if (ytid) {
                embedUrl = `https://www.youtube-nocookie.com/embed/${ytid}?autoplay=1`;
            } else if (url.includes('?')) {
                embedUrl = url + '&autoplay=1';
            } else {
                embedUrl = url + '?autoplay=1';
            }
            wrap.innerHTML = `<iframe src="${embedUrl}" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
        }

        document.getElementById('video-lightbox').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox(e, force) {
        if (force || (e && e.target === document.getElementById('video-lightbox'))) {
            document.getElementById('video-lightbox').classList.remove('active');
            document.getElementById('lightbox-video-wrap').innerHTML = '';
            document.body.style.overflow = '';
        }
    }

    // ---- Image Lightbox ----
    let currentGalleryImages = [];
    let currentGalleryIndex = 0;
    let currentGalleryTitle = '';

    function updateGalleryLightboxView() {
        if (!currentGalleryImages || currentGalleryImages.length === 0) return;
        const currentSrc = currentGalleryImages[currentGalleryIndex];
        document.getElementById('lightbox-img').src = currentSrc;

        const counter = document.getElementById('lightbox-counter');
        const prevBtn = document.getElementById('lightbox-prev-btn');
        const nextBtn = document.getElementById('lightbox-next-btn');

        if (currentGalleryImages.length > 1) {
            counter.style.display = 'block';
            counter.textContent = `${currentGalleryIndex + 1} / ${currentGalleryImages.length}`;
            prevBtn.style.display = 'flex';
            nextBtn.style.display = 'flex';
        } else {
            counter.style.display = 'none';
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
        }
    }

    function openImageGallery(images, title, startIndex = 0) {
        currentGalleryImages = Array.isArray(images) ? images : [images];
        currentGalleryIndex = Math.max(0, Math.min(startIndex, currentGalleryImages.length - 1));
        currentGalleryTitle = title || '';
        document.getElementById('lightbox-img-title').textContent = currentGalleryTitle;
        updateGalleryLightboxView();
        document.getElementById('image-lightbox').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function prevGalleryImage() {
        if (!currentGalleryImages || currentGalleryImages.length <= 1) return;
        currentGalleryIndex = (currentGalleryIndex - 1 + currentGalleryImages.length) % currentGalleryImages.length;
        updateGalleryLightboxView();
    }

    function nextGalleryImage() {
        if (!currentGalleryImages || currentGalleryImages.length <= 1) return;
        currentGalleryIndex = (currentGalleryIndex + 1) % currentGalleryImages.length;
        updateGalleryLightboxView();
    }

    function openImage(src, title) {
        openImageGallery([src], title, 0);
    }

    function closeImageLightbox(e, force) {
        if (force || (e && e.target === document.getElementById('image-lightbox'))) {
            document.getElementById('image-lightbox').classList.remove('active');
            document.getElementById('lightbox-img').src = '';
            currentGalleryImages = [];
            currentGalleryIndex = 0;
            document.body.style.overflow = '';
        }
    }

    // ---- PDF Modal ----
    function openPdf(encodedUrl, title, isPpt = false) {
        const url = decodeURIComponent(encodedUrl);
        document.getElementById('pdf-modal-title-text').textContent = title || 'Document';
        document.getElementById('pdf-iframe').src = url;
        document.getElementById('pdf-download-btn').href = url;
        const ext = isPpt ? '.ppt' : '.pdf';
        document.getElementById('pdf-download-btn').setAttribute('download', title ? title + ext : 'document' + ext);
        
        const titleIcon = document.querySelector('.pdf-modal-title i');
        if (titleIcon) {
            titleIcon.className = isPpt ? 'fa-solid fa-file-powerpoint' : 'fa-solid fa-file-pdf';
        }
        
        document.getElementById('pdf-modal').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closePdfModal() {
        document.getElementById('pdf-modal').classList.remove('active');
        document.getElementById('pdf-iframe').src = '';
        document.body.style.overflow = '';
    }

    // Keyboard navigation & close
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeLightbox(null, true);
            closeImageLightbox(null, true);
            closePdfModal();
        } else if (e.key === 'ArrowLeft') {
            if (document.getElementById('image-lightbox').classList.contains('active')) {
                prevGalleryImage();
            }
        } else if (e.key === 'ArrowRight') {
            if (document.getElementById('image-lightbox').classList.contains('active')) {
                nextGalleryImage();
            }
        }
    });

    // ---- Load Data ----
    async function loadGallery() {
        let configData = null;

        // Try API first
        try {
            const res = await fetch('/api/getConfig');
            if (res.ok) {
                const payload = await res.json();
                configData = payload.config;
            }
        } catch (err) {
            console.warn('API getConfig failed, falling back to siteConfig.json:', err);
        }

        // Fallback to static JSON file (works offline & in static hosts)
        if (!configData) {
            try {
                const staticRes = await fetch('data/siteConfig.json?v=' + Date.now());
                if (staticRes.ok) {
                    configData = await staticRes.json();
                }
            } catch (err) {
                console.error('Static siteConfig fetch failed:', err);
            }
        }

        if (!configData) {
            document.getElementById('gallery-grid').innerHTML = `
                <div class="gallery-empty">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <h3>Could not load gallery</h3>
                    <p>Please try refreshing the page.</p>
                </div>`;
            return;
        }

        // Gate: if admin has hidden the gallery page, redirect away
        if (configData.showGallery === false) {
            window.location.replace('/');
            return;
        }

        allItems = (configData.gallery || []).filter(i => !i.hidden);
        renderGallery(allItems);
        setupFilterListeners();
    }

    document.addEventListener('DOMContentLoaded', loadGallery);
    </script>

</body>
</html>
